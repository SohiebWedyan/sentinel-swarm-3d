# Safety envelope for the Leader robot's obstacle avoidance and the
# Jetson<->Raspberry Pi link.
#
# Defined now as the config CONTRACT — the code that actually enforces
# it (navigation/safety_controller.py, the Raspberry Pi safety_process)
# is Phase 1G/1E work and does not exist yet. config/lidar.yaml's
# obstacle_sectors.obstacle_distance_m is an independent, simpler
# threshold used only for the Phase 1B live sector display; once
# safety_controller.py exists it should be the only thing that reads this
# file, and lidar.yaml's copy should defer to it rather than duplicating it.

safety:
  # Raspberry Pi safety_process stops the motors if it hears nothing from
  # Jetson within this window. Deliberately NOT dependent on MQTT.
  heartbeat_timeout_s: 0.5

  caution_distance_m: 0.8
  stop_distance_m: 0.35
  emergency_distance_m: 0.15

  max_linear_velocity_mps: 0.5
  caution_velocity_limit_mps: 0.2
